name: FruityBlox Scraper Bot

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows you to trigger it manually via the 'Actions' tab

jobs:
  scrape-job:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pull Code from Repo
        uses: actions/checkout@v4

      - name: 2. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Selenium & Drivers
        run: |
          pip install selenium webdriver-manager requests

      - name: 4. Run the Scraper
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
